<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BOSSING OMR Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;
  padding: 15px;

  background: #0f172a;

  color: white;

  font-family: Arial, sans-serif;

}

.container {

  max-width: 520px;

  margin: auto;

}

.header {

  text-align: center;

  padding: 12px;

}

.header h1 {

  margin: 0;

  font-size: 23px;

}

.header p {

  margin: 6px 0;

  color: #cbd5e1;

}

.cameraBox {

  position: relative;

  width: 100%;

  aspect-ratio: 0.8221;

  background: black;

  border-radius: 15px;

  overflow: hidden;

}

video {

  width: 100%;

  height: 100%;

  object-fit: cover;

}

.guide {

  position: absolute;

  inset: 8px;

  border: 4px solid #22c55e;

  border-radius: 10px;

  pointer-events: none;

}

.guideText {

  position: absolute;

  top: 15px;

  left: 10px;

  right: 10px;

  text-align: center;

  background: rgba(0,0,0,.65);

  padding: 9px;

  border-radius: 8px;

  font-weight: bold;

}

button {

  width: 100%;

  padding: 17px;

  margin-top: 12px;

  border: none;

  border-radius: 12px;

  font-size: 19px;

  font-weight: bold;

}

.start {

  background: #2563eb;

  color: white;

}

.capture {

  background: #16a34a;

  color: white;

}

.reset {

  background: #475569;

  color: white;

}

button:disabled {

  opacity: .45;

}

.status {

  margin-top: 12px;

  padding: 15px;

  border-radius: 10px;

  text-align: center;

  background: #1e293b;

  color: #e2e8f0;

  white-space: pre-line;

}

.success {

  background: #14532d;

}

.error {

  background: #7f1d1d;

}

.warning {

  background: #78350f;

}

.result {

  margin-top: 12px;

  padding: 15px;

  border-radius: 10px;

  background: #1e293b;

}

.answerGrid {

  font-family: monospace;

  line-height: 1.5;

  font-size: 13px;

  word-break: break-word;

}

.hidden {

  display: none;

}

</style>

</head>


<body>

<div class="container">


<div class="header">

<h1>🏫 SCHOOL OMR SCANNER</h1>

<p>ONE CAPTURE = ONE STUDENT</p>

</div>


<div class="cameraBox">

<video
  id="video"
  autoplay
  playsinline>
</video>

<div class="guide"></div>

<div class="guideText">

FIT ONE STUDENT PANEL INSIDE THE FRAME

</div>

</div>


<button
  id="startButton"
  class="start"
  onclick="startCamera()">

📷 START CAMERA

</button>


<button
  id="captureButton"
  class="capture"
  onclick="captureSheet()"
  disabled>

📸 CAPTURE STUDENT

</button>


<button
  class="reset"
  onclick="resetForNextStudent()">

🔄 READY FOR NEXT STUDENT

</button>


<div
  id="status"
  class="status">

Press START CAMERA.

</div>


<div
  id="result"
  class="result hidden">

</div>


<canvas
  id="captureCanvas"
  class="hidden">
</canvas>


</div>


<script>


// ==========================================================
// CAMERA
// ==========================================================

let video =
  document.getElementById('video');

let stream = null;


// ==========================================================
// OMR GEOMETRY
//
// Based on the current printed student panel.
// Coordinates are normalized 0.0 - 1.0.
// ==========================================================

const BUBBLE_X = [

  // Items 1-25
  0.158,
  0.216,
  0.275,
  0.333,

  // Items 26-50
  0.591,
  0.649,
  0.708,
  0.766

];

const ROW_START = 0.115;

const ROW_END = 0.960;


// ==========================================================
// SHADE THRESHOLD
//
// Pilot value.
//
// Higher = stricter about what counts as fully shaded.
//
// We will calibrate this after testing a filled sheet.
// ==========================================================

const FULL_SHADE_THRESHOLD = 0.55;


// ==========================================================
// START CAMERA
// ==========================================================

async function startCamera() {

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    video.srcObject = stream;

    await video.play();


    document
      .getElementById('captureButton')
      .disabled = false;


    document
      .getElementById('startButton')
      .innerText =
      '📷 CAMERA RUNNING';


    setStatus(
      'CAMERA READY\n\n' +
      'Fit ONE STUDENT PANEL inside the green frame.',
      ''
    );


  } catch (error) {

    console.error(error);

    setStatus(
      '❌ CAMERA ERROR\n\n' +
      'Please allow camera permission and try again.',
      'error'
    );

  }

}


// ==========================================================
// CAPTURE
// ==========================================================

async function captureSheet() {

  if (!stream) {

    setStatus(
      'Please start the camera first.',
      'error'
    );

    return;

  }


  setStatus(
    '⏳ CAPTURING...\n\n' +
    'Reading QR codes and 50 answer bubbles.',
    ''
  );


  const canvas =
    document.getElementById(
      'captureCanvas'
    );

  const ctx =
    canvas.getContext('2d', {
      willReadFrequently: true
    });


  const vw = video.videoWidth;
  const vh = video.videoHeight;

  const targetRatio = 0.8221;

  let sx = 0;
  let sy = 0;
  let sw = vw;
  let sh = vh;


  /*
     Match the visible camera frame
     to our student-panel aspect ratio.
  */

  const videoRatio =
    vw / vh;


  if (videoRatio > targetRatio) {

    sw =
      vh * targetRatio;

    sx =
      (vw - sw) / 2;

  } else {

    sh =
      vw / targetRatio;

    sy =
      (vh - sh) / 2;

  }


  canvas.width =
    Math.round(sw);

  canvas.height =
    Math.round(sh);


  ctx.drawImage(

    video,

    sx,
    sy,
    sw,
    sh,

    0,
    0,
    canvas.width,
    canvas.height

  );


  const imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  // ========================================================
  // READ QR CODES
  // ========================================================

  const studentQR =
    scanRegion(
      imageData,
      0.67,
      0.01,
      0.18,
      0.20
    );


  const testQR =
    scanRegion(
      imageData,
      0.83,
      0.01,
      0.17,
      0.20
    );


  if (!studentQR) {

    setStatus(
      '❌ STUDENT QR NOT READ\n\n' +
      'Move the phone slightly closer and make sure the entire student panel is inside the green frame.',
      'error'
    );

    return;

  }


  if (!testQR) {

    setStatus(
      '❌ TEST QR NOT READ\n\n' +
      'Make sure both QR codes are inside the green frame.',
      'error'
    );

    return;

  }


  // ========================================================
  // READ 50 BUBBLES
  // ========================================================

  const answers =
    readOMR(
      imageData
    );


  // ========================================================
  // DISPLAY
  // ========================================================

  let html = '';

  html +=
    '<strong>Student QR:</strong> ' +
    escapeHtml(studentQR) +
    '<br><br>';

  html +=
    '<strong>Test QR:</strong> ' +
    escapeHtml(testQR) +
    '<br><br>';

  html +=
    '<strong>Detected answers:</strong><br>';

  html +=
    '<div class="answerGrid">';

  for (let i = 0; i < 50; i++) {

    html +=
      (i + 1) +
      ':' +
      (answers[i] || 'BLANK') +
      '  ';

    if ((i + 1) % 5 === 0) {
      html += '<br>';
    }

  }

  html += '</div>';


  document
    .getElementById('result')
    .classList.remove('hidden');

  document
    .getElementById('result')
    .innerHTML = html;


  setStatus(
    '✅ CAPTURE COMPLETE\n\n' +
    'Sending result to School OMR Scanner...',
    'success'
  );


  // ========================================================
  // SEND TO APPS SCRIPT
  // ========================================================

  if (window.opener) {

    window.opener.postMessage(

      {

        type:
          'BOSSING_OMR_RESULT',

        payload: {

          lrn:
            studentQR,

          testId:
            testQR,

          answers:
            answers

        }

      },

      'https://script.google.com'

    );

    /*
       Apps Script may use a Google-hosted
       origin after redirection. If the
       message doesn't arrive, we will
       adjust the target after the first
       connected test.
    */

  } else {

    setStatus(
      '⚠️ OMR READ COMPLETE\n\n' +
      'This camera was opened directly.\n\n' +
      'Open it from the School OMR Scanner so the result can be saved to Google Sheets.',
      'warning'
    );

  }

}


// ==========================================================
// SCAN QR REGION
// ==========================================================

function scanRegion(
  fullImage,
  nx,
  ny,
  nw,
  nh
) {

  const x =
    Math.floor(
      fullImage.width * nx
    );

  const y =
    Math.floor(
      fullImage.height * ny
    );

  const w =
    Math.floor(
      fullImage.width * nw
    );

  const h =
    Math.floor(
      fullImage.height * nh
    );


  const temp =
    document.createElement('canvas');

  temp.width = w;
  temp.height = h;


  const ctx =
    temp.getContext('2d');

  ctx.putImageData(
    cropImageData(
      fullImage,
      x,
      y,
      w,
      h
    ),
    0,
    0
  );


  const data =
    ctx.getImageData(
      0,
      0,
      w,
      h
    );


  const code =
    jsQR(
      data.data,
      data.width,
      data.height,
      {
        inversionAttempts:
          'attemptBoth'
      }
    );


  return code
    ? code.data.trim()
    : '';

}


// ==========================================================
// CROP IMAGE DATA
// ==========================================================

function cropImageData(
  source,
  x,
  y,
  w,
  h
) {

  const result =
    new ImageData(w, h);

  for (let yy = 0; yy < h; yy++) {

    for (let xx = 0; xx < w; xx++) {

      const sx = x + xx;
      const sy = y + yy;

      if (
        sx < 0 ||
        sy < 0 ||
        sx >= source.width ||
        sy >= source.height
      ) {
        continue;
      }


      const src =
        (sy * source.width + sx) * 4;

      const dst =
        (yy * w + xx) * 4;


      result.data[dst] =
        source.data[src];

      result.data[dst + 1] =
        source.data[src + 1];

      result.data[dst + 2] =
        source.data[src + 2];

      result.data[dst + 3] =
        255;

    }

  }

  return result;

}


// ==========================================================
// READ OMR
// ==========================================================

function readOMR(imageData) {

  const answers = [];


  for (let item = 1; item <= 50; item++) {

    const rowIndex =
      item <= 25
        ? item - 1
        : item - 26;


    const columnOffset =
      item <= 25
        ? 0
        : 4;


    const yNorm =
      ROW_START +
      (
        (ROW_END - ROW_START) *
        rowIndex /
        24
      );


    const scores = [];


    for (let choice = 0; choice < 4; choice++) {

      const xNorm =
        BUBBLE_X[
          columnOffset + choice
        ];


      const score =
        bubbleShadeScore(
          imageData,
          xNorm,
          yNorm
        );


      scores.push(score);

    }


    // ------------------------------------------
    // Determine fully shaded bubbles
    // ------------------------------------------

    const full =
      scores
        .map(
          function(score, index) {

            return {
              index: index,
              score: score
            };

          }
        )
        .filter(
          function(item) {

            return (
              item.score >=
              FULL_SHADE_THRESHOLD
            );

          }
        );


    if (full.length === 1) {

      answers.push(
        ['A', 'B', 'C', 'D'][
          full[0].index
        ]
      );

    }

    else if (full.length >= 2) {

      answers.push(
        'MULTIPLE'
      );

    }

    else {

      answers.push('');

    }

  }


  return answers;

}


// ==========================================================
// MEASURE BUBBLE DARKNESS
// ==========================================================

function bubbleShadeScore(
  imageData,
  xNorm,
  yNorm
) {

  const w =
    imageData.width;

  const h =
    imageData.height;


  const cx =
    xNorm * w;

  const cy =
    yNorm * h;


  /*
     Bubble radius is based on
     the current printed layout.
  */

  const innerRadius =
    Math.max(
      4,
      w * 0.012
    );


  const ringInner =
    w * 0.021;


  const ringOuter =
    w * 0.032;


  let innerSum = 0;
  let innerCount = 0;

  let ringSum = 0;
  let ringCount = 0;


  const minX =
    Math.max(
      0,
      Math.floor(
        cx - ringOuter
      )
    );

  const maxX =
    Math.min(
      w - 1,
      Math.ceil(
        cx + ringOuter
      )
    );

  const minY =
    Math.max(
      0,
      Math.floor(
        cy - ringOuter
      )
    );

  const maxY =
    Math.min(
      h - 1,
      Math.ceil(
        cy + ringOuter
      )
    );


  for (
    let y = minY;
    y <= maxY;
    y++
  ) {

    for (
      let x = minX;
      x <= maxX;
      x++
    ) {

      const dx =
        x - cx;

      const dy =
        y - cy;

      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      const index =
        (y * w + x) * 4;


      const gray =
        (
          0.299 *
          imageData.data[index]
        ) +
        (
          0.587 *
          imageData.data[index + 1]
        ) +
        (
          0.114 *
          imageData.data[index + 2]
        );


      if (
        distance <=
        innerRadius
      ) {

        innerSum += gray;
        innerCount++;

      }

      else if (
        distance >= ringInner &&
        distance <= ringOuter
      ) {

        ringSum += gray;
        ringCount++;

      }

    }

  }


  if (
    innerCount === 0 ||
    ringCount === 0
  ) {

    return 0;

  }


  const inner =
    innerSum / innerCount;

  const background =
    ringSum / ringCount;


  /*
     Higher score =
     darker bubble interior.
  */

  return Math.max(
    0,
    (
      background - inner
    ) /
    Math.max(
      background,
      1
    )
  );

}


// ==========================================================
// RESET
// ==========================================================

function resetForNextStudent() {

  document
    .getElementById('result')
    .classList.add('hidden');


  setStatus(
    'READY FOR NEXT STUDENT\n\n' +
    'Fit ONE student panel inside the green frame.',
    ''
  );

}


// ==========================================================
// STATUS
// ==========================================================

function setStatus(
  text,
  type
) {

  const el =
    document.getElementById(
      'status'
    );

  el.innerText =
    text;

  el.className =
    'status ' +
    (type || '');

}


// ==========================================================
// HTML SAFETY
// ==========================================================

function escapeHtml(value) {

  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}

</script>

</body>

</html>
