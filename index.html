<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>School OMR Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #111;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
}

.header {
  text-align: center;
  padding: 12px 8px 8px;
  font-size: 23px;
  font-weight: bold;
}

.subheader {
  text-align: center;
  font-size: 14px;
  color: #ddd;
  margin-bottom: 8px;
}

.cameraArea {
  position: relative;
  width: 100%;
  max-width: 900px;
  margin: auto;
  background: black;
  overflow: hidden;
}

video {
  display: block;
  width: 100%;
  height: auto;
  background: black;
}

#guideFrame {
  position: absolute;
  left: 17%;
  top: 15%;
  width: 66%;
  height: 70%;
  border: 5px solid #00ff55;
  border-radius: 18px;
  box-shadow:
    0 0 10px #00ff55,
    0 0 20px #00ff55;
  pointer-events: none;
}

.guideText {
  position: absolute;
  top: 9%;
  left: 0;
  width: 100%;
  text-align: center;
  color: #00ff55;
  font-size: 18px;
  font-weight: bold;
  text-shadow: 0 0 5px black;
  pointer-events: none;
}

.controls {
  padding: 10px;
  max-width: 900px;
  margin: auto;
}

button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 15px;
  margin: 5px 0;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#startBtn {
  background: #1976d2;
  color: white;
}

#captureBtn {
  background: #00c853;
  color: white;
  display: none;
}

#nextBtn {
  background: #f57c00;
  color: white;
  display: none;
}

button:disabled {
  opacity: 0.45;
}

.checklist {
  max-width: 900px;
  margin: 8px auto;
  padding: 8px 10px;
}

.check {
  background: #292929;
  border-radius: 10px;
  padding: 12px;
  margin: 6px 0;
  font-size: 16px;
}

.check.ready {
  color: #00ff55;
}

.check.waiting {
  color: #ffd740;
}

.check.error {
  color: #ff5252;
}

.readyBox {
  max-width: 900px;
  margin: 8px auto;
  padding: 12px;
  text-align: center;
  border-radius: 12px;
  background: #222;
  font-size: 22px;
  font-weight: bold;
}

.readyBox.ready {
  background: #063d1a;
  color: #00ff55;
}

.readyBox.waiting {
  color: #ffd740;
}

.statusBox {
  max-width: 900px;
  margin: 8px auto 20px;
  padding: 12px;
  text-align: center;
  background: #222;
  border-radius: 12px;
  font-size: 16px;
  white-space: pre-line;
}

canvas {
  display: none;
}
</style>
</head>

<body>

<div class="header">
  🏫 SCHOOL OMR SCANNER
</div>

<div class="subheader">
  ONE CAPTURE = ONE STUDENT
</div>

<div class="cameraArea">

  <video id="video" autoplay playsinline muted></video>

  <div class="guideText">
    FIT ONE STUDENT PANEL INSIDE THE FRAME
  </div>

  <div id="guideFrame"></div>

</div>

<div class="controls">

  <button id="startBtn">
    📷 START CAMERA
  </button>

  <button id="captureBtn">
    📸 CAPTURE STUDENT
  </button>

  <button id="nextBtn">
    🔄 READY FOR NEXT STUDENT
  </button>

</div>

<div class="checklist">

  <div id="cameraStatus" class="check waiting">
    ⏳ Camera: Waiting...
  </div>

  <div id="studentStatus" class="check waiting">
    ⏳ Student QR: Looking...
  </div>

  <div id="testStatus" class="check waiting">
    ⏳ Test QR: Looking...
  </div>

  <div id="omrStatus" class="check waiting">
    ⏳ OMR Panel: Position inside green frame
  </div>

</div>

<div id="readyBox" class="readyBox waiting">
  WAITING FOR QR CODES
</div>

<div id="statusBox" class="statusBox">
  Press START CAMERA.
</div>

<canvas id="canvas"></canvas>

<script>

/* ============================================================
   SCHOOL OMR SCANNER
   RESTORED WORKING VERSION
   ONLY CHANGE:
   TEST QR SEARCH AREA IS WIDER
   ============================================================ */


/* ------------------------------------------------------------
   APPS SCRIPT WEB APP
   ------------------------------------------------------------ */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwOSW8l1H5_WqOnfRv4sklhhGNQGXm_-9-FvciaSTYrmR6vS2X-A3_yCiXYhN7Di0ay4A/exec";


/* ------------------------------------------------------------
   ELEMENTS
   ------------------------------------------------------------ */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
  willReadFrequently: true
});

const startBtn = document.getElementById("startBtn");
const captureBtn = document.getElementById("captureBtn");
const nextBtn = document.getElementById("nextBtn");

const cameraStatus = document.getElementById("cameraStatus");
const studentStatus = document.getElementById("studentStatus");
const testStatus = document.getElementById("testStatus");
const omrStatus = document.getElementById("omrStatus");

const readyBox = document.getElementById("readyBox");
const statusBox = document.getElementById("statusBox");


/* ------------------------------------------------------------
   CAMERA VARIABLES
   ------------------------------------------------------------ */

let stream = null;
let scanning = false;
let captureInProgress = false;

let studentLRN = "";
let testId = "";

let studentFound = false;
let testFound = false;


/* ------------------------------------------------------------
   OMR GEOMETRY
   These are the coordinates from the working pilot version.
   ------------------------------------------------------------ */

const BUBBLE_X = [
  0.158,
  0.216,
  0.275,
  0.333,

  0.591,
  0.649,
  0.708,
  0.766
];

const ROW_START = 0.115;
const ROW_END   = 0.960;


/* ------------------------------------------------------------
   START CAMERA
   ------------------------------------------------------------ */

startBtn.addEventListener("click", async function() {

  if (stream) {
    return;
  }

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: "environment"
        },
        width: {
          ideal: 1920
        },
        height: {
          ideal: 1080
        }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    scanning = true;

    cameraStatus.className = "check ready";
    cameraStatus.textContent = "✅ Camera: READY";

    statusBox.textContent =
      "CAMERA READY\n\nFit ONE STUDENT PANEL inside the green frame.";

    startBtn.style.display = "none";

    beginScanning();

  } catch (error) {

    cameraStatus.className = "check error";
    cameraStatus.textContent =
      "❌ Camera: Cannot start";

    statusBox.textContent =
      "Camera could not start.\n\n" +
      "Please allow camera permission and try again.";

    console.error(error);

  }

});


/* ------------------------------------------------------------
   CONTINUOUS SCANNING
   ------------------------------------------------------------ */

function beginScanning() {

  if (!scanning) {
    return;
  }

  if (
    video.readyState >= 2 &&
    video.videoWidth > 0 &&
    video.videoHeight > 0
  ) {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const imageData = ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

    detectStudentQR(imageData);

    detectTestQR(imageData);

    updateReadyState();

  }

  requestAnimationFrame(beginScanning);
}


/* ------------------------------------------------------------
   QR REGION SCANNER
   ------------------------------------------------------------ */

function scanRegion(
  imageData,
  nx,
  ny,
  nw,
  nh
) {

  const fullWidth = imageData.width;
  const fullHeight = imageData.height;

  const x = Math.max(
    0,
    Math.floor(fullWidth * nx)
  );

  const y = Math.max(
    0,
    Math.floor(fullHeight * ny)
  );

  const w = Math.min(
    fullWidth - x,
    Math.floor(fullWidth * nw)
  );

  const h = Math.min(
    fullHeight - y,
    Math.floor(fullHeight * nh)
  );

  if (w <= 0 || h <= 0) {
    return null;
  }

  const tempCanvas = document.createElement("canvas");

  tempCanvas.width = w;
  tempCanvas.height = h;

  const tempCtx = tempCanvas.getContext("2d", {
    willReadFrequently: true
  });

  tempCtx.putImageData(
    imageData,
    -x,
    -y
  );

  const region = tempCtx.getImageData(
    0,
    0,
    w,
    h
  );

  const code = jsQR(
    region.data,
    region.width,
    region.height,
    {
      inversionAttempts: "attemptBoth"
    }
  );

  return code;
}


/* ------------------------------------------------------------
   STUDENT QR
   ------------------------------------------------------------ */

function detectStudentQR(imageData) {

  if (studentFound) {
    return;
  }

  /*
     STUDENT QR
     Original working region
  */

  const code = scanRegion(
    imageData,
    0.67,
    0.01,
    0.18,
    0.20
  );

  if (!code || !code.data) {

    studentStatus.className = "check waiting";
    studentStatus.textContent =
      "⏳ Student QR: Looking...";

    return;
  }

  const value = String(code.data).trim();

  if (!value) {
    return;
  }

  studentLRN = value;
  studentFound = true;

  studentStatus.className = "check ready";

  studentStatus.textContent =
    "✅ Student QR: " + studentLRN;

}


/* ------------------------------------------------------------
   TEST QR
   ------------------------------------------------------------ */

function detectTestQR(imageData) {

  if (testFound) {
    return;
  }

  /*
     ORIGINAL WORKING REGION WAS APPROXIMATELY:

     0.83, 0.01, 0.17, 0.20

     ONLY THIS WAS CHANGED.

     NEW WIDER SEARCH AREA:

     x = 0.72
     y = 0.01
     width = 0.28
     height = 0.25

     This gives the scanner more room to find the QR
     when the right side of the printed sheet is harder
     to position in the camera.
  */

  const code = scanRegion(
    imageData,
    0.72,
    0.01,
    0.28,
    0.25
  );

  if (!code || !code.data) {

    testStatus.className = "check waiting";
    testStatus.textContent =
      "⏳ Test QR: Looking...";

    return;
  }

  const value = String(code.data).trim();

  if (!value) {
    return;
  }

  testId = value;
  testFound = true;

  testStatus.className = "check ready";

  testStatus.textContent =
    "✅ Test QR: " + testId;

}


/* ------------------------------------------------------------
   READY STATE
   ------------------------------------------------------------ */

function updateReadyState() {

  if (
    studentFound &&
    testFound &&
    !captureInProgress
  ) {

    omrStatus.className = "check ready";
    omrStatus.textContent =
      "✅ OMR Panel: READY";

    readyBox.className = "readyBox ready";

    readyBox.textContent =
      "READY TO CAPTURE";

    captureBtn.style.display = "block";

    statusBox.textContent =
      "Student QR ✓\n" +
      "Test QR ✓\n" +
      "OMR Panel ✓\n\n" +
      "You may now press CAPTURE STUDENT.";

  } else {

    omrStatus.className = "check waiting";
    omrStatus.textContent =
      "⏳ OMR Panel: Position inside green frame";

    readyBox.className = "readyBox waiting";

    readyBox.textContent =
      "WAITING FOR QR CODES";

    captureBtn.style.display = "none";

  }

}


/* ------------------------------------------------------------
   CAPTURE BUTTON
   ------------------------------------------------------------ */

captureBtn.addEventListener(
  "click",
  captureSheet
);


/* ------------------------------------------------------------
   CAPTURE ONE STUDENT
   ------------------------------------------------------------ */

function captureSheet() {

  if (captureInProgress) {
    return;
  }

  if (!studentFound) {

    statusBox.textContent =
      "❌ STUDENT QR NOT READ";

    return;
  }

  if (!testFound) {

    statusBox.textContent =
      "❌ TEST QR NOT READ";

    return;
  }

  captureInProgress = true;

  captureBtn.style.display = "none";

  readyBox.className = "readyBox waiting";

  readyBox.textContent =
    "⏳ CAPTURING...";

  statusBox.textContent =
    "⏳ CAPTURING...\n\n" +
    "Reading QR codes and 50 answer bubbles.";

  /*
     Capture the current camera frame.
  */

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  /*
     Read OMR.
  */

  const answers = readOMR(
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    )
  );

  if (!answers || answers.length !== 50) {

    captureInProgress = false;

    statusBox.textContent =
      "❌ OMR READING FAILED\n\n" +
      "Please place one student panel inside the green frame and try again.";

    captureBtn.style.display = "block";

    return;
  }

  /*
     Prepare result.
  */

  const payload = {
    lrn: studentLRN,
    testId: testId,
    answers: answers
  };


  /*
     Send directly to Apps Script.
  */

  statusBox.textContent =
    "✅ CAPTURE COMPLETE\n\n" +
    "Sending result to School OMR Scanner...";

  sendResultToAppsScript(payload);

}


/* ------------------------------------------------------------
   OMR READER
   ------------------------------------------------------------ */

function readOMR(imageData) {

  const width = imageData.width;
  const height = imageData.height;

  /*
     The camera frame represents approximately one
     complete student panel.

     These normalized coordinates are based on the
     original working pilot sheet.
  */

  const frameX = Math.floor(width * 0.17);
  const frameY = Math.floor(height * 0.15);

  const frameW = Math.floor(width * 0.66);
  const frameH = Math.floor(height * 0.70);

  const answers = [];

  /*
     The bubble radius is deliberately modest so that
     the reader samples the inside of the bubble.
  */

  const sampleRadius = Math.max(
    4,
    Math.floor(
      Math.min(frameW, frameH) * 0.012
    )
  );


  for (let item = 0; item < 50; item++) {

    let columnIndex;
    let rowIndex;

    if (item < 25) {

      columnIndex = 0;
      rowIndex = item;

    } else {

      columnIndex = 4;
      rowIndex = item - 25;

    }


    const normalizedX =
      BUBBLE_X[columnIndex];

    const normalizedY =
      ROW_START +
      (
        rowIndex *
        (
          (ROW_END - ROW_START) / 24
        )
      );


    const centerX =
      frameX +
      Math.floor(
        frameW * normalizedX
      );

    const centerY =
      frameY +
      Math.floor(
        frameH * normalizedY
      );


    const densities = [];


    /*
       A-D bubble positions.
    */

    for (let option = 0; option < 4; option++) {

      const optionIndex =
        columnIndex + option;

      const optionX =
        frameX +
        Math.floor(
          frameW *
          BUBBLE_X[optionIndex]
        );

      const density =
        sampleDarkness(
          imageData,
          optionX,
          centerY,
          sampleRadius
        );

      densities.push(density);
    }


    /*
       ONLY FULLY-SHADED COUNTS.
       The working pilot threshold is approximately 0.55.
    */

    const FULL_SHADE_THRESHOLD = 0.55;

    const darkOptions = [];

    for (
      let option = 0;
      option < densities.length;
      option++
    ) {

      if (
        densities[option] >=
        FULL_SHADE_THRESHOLD
      ) {

        darkOptions.push(option);

      }

    }


    if (darkOptions.length === 1) {

      answers.push(
        ["A", "B", "C", "D"][
          darkOptions[0]
        ]
      );

    } else if (darkOptions.length === 0) {

      answers.push("");

    } else {

      answers.push("MULTIPLE");

    }

  }


  return answers;
}


/* ------------------------------------------------------------
   SAMPLE DARKNESS INSIDE A BUBBLE
   ------------------------------------------------------------ */

function sampleDarkness(
  imageData,
  cx,
  cy,
  radius
) {

  const data = imageData.data;

  let darkPixels = 0;
  let totalPixels = 0;

  const width = imageData.width;
  const height = imageData.height;

  for (
    let y = cy - radius;
    y <= cy + radius;
    y++
  ) {

    if (y < 0 || y >= height) {
      continue;
    }

    for (
      let x = cx - radius;
      x <= cx + radius;
      x++
    ) {

      if (x < 0 || x >= width) {
        continue;
      }

      const dx = x - cx;
      const dy = y - cy;

      if (
        dx * dx +
        dy * dy >
        radius * radius
      ) {
        continue;
      }

      const index =
        (y * width + x) * 4;

      const r = data[index];
      const g = data[index + 1];
      const b = data[index + 2];

      const gray =
        (
          r * 0.299 +
          g * 0.587 +
          b * 0.114
        );

      /*
         Dark pixel threshold.
      */

      if (gray < 150) {
        darkPixels++;
      }

      totalPixels++;

    }
  }

  if (totalPixels === 0) {
    return 0;
  }

  return darkPixels / totalPixels;
}


/* ------------------------------------------------------------
   SEND RESULT TO GOOGLE APPS SCRIPT
   ------------------------------------------------------------ */

function sendResultToAppsScript(payload) {

  /*
     Use a normal HTML POST.

     This avoids:
     - window.opener
     - postMessage dependency
     - NO SCHOOL OMR WINDOW
     - fetch/no-cors response problems
  */

  const form =
    document.createElement("form");

  form.method = "POST";

  form.action =
    APPS_SCRIPT_URL;

  form.target = "_self";

  const dataField =
    document.createElement("input");

  dataField.type = "hidden";

  dataField.name = "data";

  dataField.value =
    JSON.stringify(payload);

  form.appendChild(dataField);

  document.body.appendChild(form);

  form.submit();

}


/* ------------------------------------------------------------
   READY FOR NEXT STUDENT
   ------------------------------------------------------------ */

nextBtn.addEventListener(
  "click",
  function() {

    studentLRN = "";
    testId = "";

    studentFound = false;
    testFound = false;

    captureInProgress = false;

    nextBtn.style.display = "none";

    captureBtn.style.display = "none";

    studentStatus.className =
      "check waiting";

    studentStatus.textContent =
      "⏳ Student QR: Looking...";

    testStatus.className =
      "check waiting";

    testStatus.textContent =
      "⏳ Test QR: Looking...";

    omrStatus.className =
      "check waiting";

    omrStatus.textContent =
      "⏳ OMR Panel: Position inside green frame";

    readyBox.className =
      "readyBox waiting";

    readyBox.textContent =
      "WAITING FOR QR CODES";

    statusBox.textContent =
      "READY FOR NEXT STUDENT\n\n" +
      "Fit the next student panel inside the green frame.";

  }
);

</script>

</body>
</html>
