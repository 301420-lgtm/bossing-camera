<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOSSING OMR Camera</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 420px;
      margin: auto;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #1769aa;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    #status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #eef2f7;
      font-size: 17px;
      word-break: break-word;
    }

    .instruction {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🏫 BOSSING OMR SCANNER</h1>

  <div class="subtitle">
    QR Camera
  </div>

  <div id="reader"></div>

  <button id="startButton" onclick="startCamera()">
    📷 START CAMERA
  </button>

  <div id="status">
    Camera is ready.
  </div>

  <div class="instruction">
    Point the camera at the QR code.
  </div>

</div>

<script>

let scanner = null;
let cameraRunning = false;
let lastCode = "";
let lastScanTime = 0;

function setStatus(message) {
  document.getElementById("status").innerText = message;
}

async function startCamera() {

  if (cameraRunning) {
    return;
  }

  setStatus("Starting camera... Please allow camera access.");

  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 10,
    qrbox: {
      width: 280,
      height: 280
    }
  };

  try {

    await scanner.start(
      { facingMode: "environment" },
      config,

      function(decodedText) {

        const now = Date.now();

        // Prevent the same QR from firing repeatedly
        if (
          decodedText === lastCode &&
          now - lastScanTime < 2000
        ) {
          return;
        }

        lastCode = decodedText;
        lastScanTime = now;

        setStatus("QR detected: " + decodedText);

        // Send QR result back to the Apps Script window
        if (window.opener) {

          window.opener.postMessage(
            {
              type: "BOSSING_QR",
              value: decodedText
            },
            "*"
          );

        }

      },

      function(errorMessage) {
        // Normal scanning errors are ignored.
      }
    );

    cameraRunning = true;

    document.getElementById("startButton").innerText =
      "📷 CAMERA RUNNING";

    setStatus(
      "Camera is running. Point it at a QR code."
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "Camera could not start. Make sure camera permission is allowed."
    );

  }
}

</script>

</body>
</html>
